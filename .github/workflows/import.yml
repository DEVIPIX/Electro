name: import
on: workflow_dispatch
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unpack and commit
        run: |
          unzip -q Electro-github-ready.zip -x 'Electro-main/.github/workflows/*'
          rm Electro-github-ready.zip
          cp -a Electro-main/. .
          rm -rf Electro-main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Electro: initial release (fork of BackPack v2.0.0)"
          git push
